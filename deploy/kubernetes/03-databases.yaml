apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: astro-production
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "astro_user"
            - name: POSTGRES_PASSWORD
              value: "secure_pass"
            - name: POSTGRES_DB
              value: "astro_db"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: astro-production
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: astro-production
spec:
  serviceName: "neo4j-service"
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - containerPort: 7687
          env:
            - name: NEO4J_AUTH
              value: "none"
          volumeMounts:
            - name: neo4j-storage
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: neo4j-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j-service
  namespace: astro-production
spec:
  ports:
    - port: 7687
  selector:
    app: neo4j
