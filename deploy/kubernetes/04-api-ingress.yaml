apiVersion: apps/v1
kind: Deployment
metadata:
  name: astroengine-api
  namespace: astro-production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: astroengine-api
  template:
    metadata:
      labels:
        app: astroengine-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: api-container
          image: YOUR_CONTAINER_REGISTRY/astroengine-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: astroengine-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: astroengine-secrets
                  key: GEMINI_API_KEY
            - name: WEBHOOK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: astroengine-secrets
                  key: WEBHOOK_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: astroengine-api-service
  namespace: astro-production
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: astroengine-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astroengine-ingress
  namespace: astro-production
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: api.astroengine.production
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: astroengine-api-service
                port:
                  number: 8080
