global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'stage_name', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'engineering-emergency-channels'

receivers:
- name: 'engineering-emergency-channels'
  slack_configs:
  - api_url: 'https://slack.com'
    channel: '#astroengine-alerts-devsecops'
    send_resolved: true
    title: '[[{{ .Status | upper }}]] {{ .CommonAnnotations.summary }}'
    text: >-
      *Alert Description:* {{ .CommonAnnotations.description }}
      *Severity Factor:* `{{ .CommonLabels.severity }}`
      *Infrastructure Impact:* Sub-graph calculation performance degrades; checkout conversions risk friction.
      
  pagerduty_configs:
  - service_key: 'YOUR_INTEGRATION_ROUTING_KEY_FROM_PAGERDUTY_DASHBOARD'
    severity: 'critical'
    send_resolved: true
    description: 'AstroEngine P99 Latency Exception: Stage [{{ .CommonLabels.stage_name }}] breached 500ms limit.'
