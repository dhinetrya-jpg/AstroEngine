version: '3.8'

services:
  astroengine-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astroengine-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://astro_admin:astro_secure_2026@postgres:5432/astro_engine_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=astro_graph_secret
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - neo4j
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: astroengine-postgres
    environment:
      - POSTGRES_USER=astro_admin
      - POSTGRES_PASSWORD=astro_secure_2026
      - POSTGRES_DB=astro_engine_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  neo4j:
    image: neo4j:5.20-community
    container_name: astroengine-neo4j
    environment:
      - NEO4J_AUTH=neo4j/astro_graph_secret
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4jdata:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
